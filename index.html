<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extracted Archives</title>
<meta name="description" content="Peat harvesting and data centres in Ireland, read as two archives and two extractions.">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* Landing: one full-bleed image, centred title; click anywhere to enter. */
  body.landing { margin: 0; min-height: 100vh; overflow: hidden; background: var(--ink); color: var(--paper); }
  a.enter-all { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--paper); text-decoration: none; cursor: pointer; padding: 0 var(--margin); }
  .landing .bleed { position: fixed; inset: 0; }
  .landing .bleed img { width: 100%; height: 100%; object-fit: cover; display: block;
    filter: grayscale(0.75) contrast(0.85) sepia(0.03) brightness(0.9); }
  .landing .bleed.empty img { display: none; }
  .landing .veil { position: fixed; inset: 0; background: rgba(34,30,28,.35); pointer-events: none; }
  .landing .label { color: var(--grey); }
  .landing h1 { font-size: clamp(52px, 8vw, 104px); line-height: 1.02; margin: 18px 0 22px; letter-spacing: -0.01em; }
  .landing .hint { font: 400 12px/1 var(--font-head); letter-spacing: .14em; text-transform: uppercase; color: var(--grey); }
  a.enter-all:hover .hint, a.enter-all:focus-visible .hint { color: var(--pink); }
</style>
</head>
<body class="landing" data-page="landing">
  <div class="bleed" id="bleed">
    <!-- Add your landing image as assets/landing.jpg -->
    <img src="assets/landing.jpg" alt="" onerror="document.getElementById('bleed').classList.add('empty')">
  </div>
  <div class="veil"></div>
  <a class="enter-all" href="menu.html" aria-label="Enter Extracted Archives">
    <span class="label">Peat harvesting and data centres in Ireland</span>
    <h1>Extracted Archives</h1>
    <span class="hint">(click to enter)</span>
  </a>
</body>
</html>
